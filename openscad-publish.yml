# Declares which OpenSCAD model(s) are published into the docs site and how.
# Consumed by the openscad-web GitHub Action in .github/workflows/pages.yml.
# Reference: https://github.com/CameronBrooks11/openscad-web/blob/v0/docs/PUBLISHING.md
#
# Each example is published twice: a lightweight `static` surface (pre-rendered
# geometry + poster, ~0.7 MB, the default the docs embed) and a `customizer`
# surface (the live in-browser compiler) for the per-embed "Customize" upgrade.
# The two live surfaces share one runtime (multi-target publish).
#
# The customizer targets use projectRoot + entry because the examples are
# multi-file: they `use <../../iLOX.scad>`, which includes src/ and the
# external tessella library. pages.yml stages that minimal tree into
# publish-staging/ (everything under projectRoot becomes public), and the
# runtime hydrates the published tree at boot (openscad-web >= 0.6).

site:
  # Mount models into the Jekyll build output so they deploy with the site.
  outDir: docs/_site

targets:
  - surface: static
    geometry: ./rendered/simpleUsageRadial.off
    poster: ./rendered/simpleUsageRadial.png
    mountPath: /models/radial/
    title: Radial iLOX Tessellation

  - projectRoot: ./publish-staging
    entry: ./examples/simpleUsage/simpleUsageRadial.scad
    surface: customizer
    mountPath: /models/radial-live/
    controls: true
    download: true
    title: Radial iLOX Tessellation (interactive)

  - surface: static
    geometry: ./rendered/simpleUsageRectangular.off
    poster: ./rendered/simpleUsageRectangular.png
    mountPath: /models/rectangular/
    title: Rectangular iLOX Tessellation

  - projectRoot: ./publish-staging
    entry: ./examples/simpleUsage/simpleUsageRectangular.scad
    surface: customizer
    mountPath: /models/rectangular-live/
    controls: true
    download: true
    title: Rectangular iLOX Tessellation (interactive)
