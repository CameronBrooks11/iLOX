# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout tessella (OpenSCAD library dependency)
        # iLOX.scad does `include <tessella/tess.scad>`; OpenSCAD resolves
        # angle-bracket includes relative to the including file first, so a
        # tessella/ directory beside iLOX.scad satisfies it for both the CLI
        # render below and the staged customizer project tree.
        uses: actions/checkout@v7
        with:
          repository: CameronBrooks11/tessella
          ref: e6e97ed4f6849a82c4507855de74a13d019f94e5
          path: tessella

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # install gems in docs/ then build
        run: |
          cd docs
          bundle install
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Install OpenSCAD (color-preserving OFF export)
        # ubuntu's `openscad` package is 2021.01: no Manifold backend, and OFF
        # export drops color() entirely, so the static 3D views rendered every
        # model in the viewer's default cameo yellow while the posters (preview
        # mode, see below) kept their colors. Manifold arrived in the 2025.03
        # development snapshots and there is still no stable release carrying
        # it, so pin a snapshot AppImage and check its published checksum.
        #
        # Snapshots are pruned after roughly eight months. When this 404s, pick
        # a newer build from https://files.openscad.org/snapshots/ and update
        # both values -- each AppImage has a .sha256 published beside it.
        #
        # --appimage-extract-and-run avoids needing FUSE, which the runners
        # do not provide.
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.08.19-x86_64.AppImage
          OPENSCAD_SHA256: fdd818025e890f465ffacffbe7d0c6fa3ebeb3f7c18ee860a909ab41396be643
        run: |
          set -euo pipefail
          sudo apt-get update
          # The AppImage bundles Qt but links the system GL/font stack, which the
          # runner image does not carry -- apt's openscad used to pull these in as
          # dependencies. Without them the AppImage dies at load time with
          # "libEGL.so.1: cannot open shared object file", before it runs at all.
          sudo apt-get install -y xvfb \
            libegl1 libgl1 libopengl0 libfontconfig1 libharfbuzz0b
          curl -fSL -o /tmp/openscad.AppImage \
            "https://files.openscad.org/snapshots/${OPENSCAD_SNAPSHOT}"
          echo "${OPENSCAD_SHA256}  /tmp/openscad.AppImage" | sha256sum -c -
          chmod +x /tmp/openscad.AppImage
          /tmp/openscad.AppImage --appimage-extract-and-run --version

      - name: Render static model geometry
        # Pre-render the models used by `static` surfaces to OFF (+ a PNG
        # poster). color() only survives into OFF on the Manifold backend --
        # CGAL drops it -- and CGAL is still the default on some releases, so
        # pass --backend explicitly rather than relying on the default.
        #
        # The PNG poster needs an OpenGL context, so render it under xvfb (a
        # virtual display). Posters stay in preview mode (no --render), which
        # keeps color() on every OpenSCAD version -- that is why they were the
        # one colored thing on the page before this fix.
        run: |
          set -euo pipefail
          mkdir -p rendered
          for model in simpleUsageRadial simpleUsageRectangular; do
            /tmp/openscad.AppImage --appimage-extract-and-run --backend=Manifold \
              "examples/simpleUsage/$model.scad" -o "rendered/$model.off"
            xvfb-run -a /tmp/openscad.AppImage --appimage-extract-and-run \
              "examples/simpleUsage/$model.scad" -o "rendered/$model.png" \
              --imgsize=1000,750 --viewall --autocenter

            # Fail loudly if the OFF came out colorless. Without this the only
            # symptom is embeds quietly reverting to the viewer's default yellow,
            # which is how this went unnoticed the first time. A colored face line
            # is "<n> <n indices> r g b" -- i.e. at least n+4 fields.
            if ! awk '$1 ~ /^[0-9]+$/ && $1 >= 3 && NF >= $1 + 4 { found = 1; exit } END { exit !found }' \
              "rendered/$model.off"; then
              echo "::error::rendered/$model.off carries no per-face colors -- check the OpenSCAD version and --backend" >&2
              exit 1
            fi
          done

      - name: Stage customizer project tree
        # The customizer targets publish everything under their projectRoot, so
        # stage only what the entry files need — the library, its src/, the
        # tessella dependency, and the example entries — with the repo layout
        # preserved so relative `use <../../iLOX.scad>` still resolves.
        run: |
          mkdir -p publish-staging/examples/simpleUsage publish-staging/tessella
          cp iLOX.scad publish-staging/
          cp -r src publish-staging/src
          cp tessella/tess.scad publish-staging/tessella/
          cp -r tessella/src publish-staging/tessella/src
          cp examples/simpleUsage/*.scad examples/simpleUsage/*.json publish-staging/examples/simpleUsage/

      - name: Assemble OpenSCAD model surfaces
        # Publishes the models declared in openscad-publish.yml into the built
        # Jekyll site (docs/_site), served same-origin.
        uses: CameronBrooks11/openscad-web@v0
        with:
          config: ./openscad-publish.yml

      - name: Upload artifact
        # Automatically uploads the generated docs/_site folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
