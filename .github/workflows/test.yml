name: Test

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    # 24.04's openscad package is 2021.01, the version the apt job is for.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A pinned snapshot, and the Debian/Ubuntu package (2021.01).
        openscad: [snapshot, apt]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install scadman and sync tessella
        # scadman.lock pins tessella; `scadman env` syncs it and prints the folder that goes on
        # OPENSCADPATH, so `include <tessella/tess.scad>` resolves. The release and its sha256
        # move together.
        env:
          SCADMAN_VERSION: v0.1.0-alpha.4
          SCADMAN_SHA256: 6e5afe41bec97f63db17ce216f2bb52399a4cfb19901577fe6fc8286c295b2b3
        run: |
          set -euo pipefail
          file="scadman-${SCADMAN_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "/tmp/$file" "https://github.com/CameronBrooks11/scadman/releases/download/${SCADMAN_VERSION}/$file"
          echo "${SCADMAN_SHA256}  /tmp/$file" | sha256sum -c -
          tar -xzf "/tmp/$file" -C /tmp scadman
          echo "OPENSCADPATH=$(/tmp/scadman env)" >> "$GITHUB_ENV"

      - name: Install OpenSCAD snapshot
        if: matrix.openscad == 'snapshot'
        # The AppImage and its checksum; update both together.
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.08.19-x86_64.AppImage
          OPENSCAD_SHA256: fdd818025e890f465ffacffbe7d0c6fa3ebeb3f7c18ee860a909ab41396be643
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libfontconfig1 libharfbuzz0b
          curl -fSL -o /tmp/openscad.AppImage "https://files.openscad.org/snapshots/${OPENSCAD_SNAPSHOT}"
          echo "${OPENSCAD_SHA256}  /tmp/openscad.AppImage" | sha256sum -c -
          chmod +x /tmp/openscad.AppImage
          printf '#!/bin/sh\nexec /tmp/openscad.AppImage --appimage-extract-and-run "$@"\n' > /tmp/openscad
          chmod +x /tmp/openscad
          echo "OPENSCAD=/tmp/openscad" >> "$GITHUB_ENV"

      - name: Install OpenSCAD from apt
        if: matrix.openscad == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          echo "OPENSCAD=openscad" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          "$OPENSCAD" --version
          tests/run.sh
